<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img"><rect width="100%" height="100%" fill="#fafbfc"/><g font-family="Arial,sans-serif" fill="#202428"><text x="30" y="42" font-size="23">UART · Capture workflow (illustration)</text><rect x="30" y="70" width="840" height="150" rx="10" fill="#202428"/><g fill="#e8eef4" font-family="monospace" font-size="18"><text x="50" y="105">$ ls -l /dev/serial/by-id/</text><text x="50" y="145">$ screen -L /dev/ttyUSB0 115200</text><text x="50" y="185">115200 baud · 8 data bits · no parity · 1 stop bit</text></g><text x="30" y="260" font-size="20">1. Select port → 2. Start capture → 3. Power on Jetson</text><text x="30" y="298" font-size="17">No hardware / software flow control · Only one terminal per port</text><text x="30" y="330" font-size="17">Exit screen: Ctrl-A, K, Y · Log: screenlog.0</text></g></svg>